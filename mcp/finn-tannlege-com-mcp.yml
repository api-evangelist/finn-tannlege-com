name: finn-tannlege
title: Finn-tannlege — Norwegian dental clinic search
description: >-
  Search and compare Norwegian dental clinics (5,447 on 2026-09-19) by free text, county (fylke),
  specialty, Helfo direct-billing agreement and emergency-duty (akuttvakt) availability, fetch a single
  clinic profile by organisation number or UUID, list dental chains and read market statistics. Every
  tool is read-only and annotated as such.
status: published
deployment:
  mode: both
  endpoint: https://finn-tannlege.com/mcp
  install: npx finn-tannlege-mcp
  package: https://www.npmjs.com/package/finn-tannlege-mcp
  auth: none
  verified: probed
  note: >-
    Two shipped forms of one server. The REMOTE Streamable-HTTP endpoint answered a full anonymous
    handshake: initialize returned serverInfo {name finn-tannlege, version 0.1.0}, protocolVersion
    2025-06-18 and an Mcp-Session-Id header; tools/list with that header returned five tools with
    inputSchema and annotations. The LOCAL-STDIO package finn-tannlege-mcp (npm 0.1.0, published
    2026-06-04, MIT, bin finn-tannlege-mcp, depends on @modelcontextprotocol/sdk ^1.12.1) is the same tool
    set proxied to the REST API, with FINN_TANNLEGE_URL as its only environment variable. The provider's
    README recommends the URL for ChatGPT and remote clients and npx for Claude Desktop/Cursor.
  checked: '2026-09-19'
transport: streamable-http
session:
  required: true
  header: Mcp-Session-Id
  note: >-
    A tools/list POST without a session returns HTTP 404 with JSON-RPC error -32001 "Session not found";
    GET /mcp without a session returns the same. Clients must initialize first and echo the session id.
    The server card says the same in plain words ("Handshake transport only: send an initialize request
    first") and states the server does not yet support the 2026-07-28 era (per-request _meta,
    server/discover).
protocol:
  negotiated: '2025-06-18'
  server_card_latest: '2025-11-25'
  server_card_supported: ['2025-11-25', '2025-06-18', '2025-03-26', '2024-11-05', '2024-10-07']
capabilities:
  tools: true
  tools_list_changed: true
  resources: false
  prompts: false
  note: >-
    Live initialize advertised only tools (listChanged true). resources/list and prompts/list each returned
    JSON-RPC -32601 "Method not found". The server card lists resources and prompts capability objects
    (listChanged false, subscribe false), which overstates the live server.
authentication:
  scheme: none
  note: >-
