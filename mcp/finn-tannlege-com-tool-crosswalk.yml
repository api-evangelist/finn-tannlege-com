  parameters as its input contract. The MCP server is a thin proxy over /api/tannlege (its npm source
  sets FINN_TANNLEGE_URL and calls the same routes), so most bindings are exact. Tool parameter names are
  Norwegian-flavoured (spesialitet, akutt, query) while the REST query parameters are specialty,
  acute_vakt and q; the mapping is recorded per row.
