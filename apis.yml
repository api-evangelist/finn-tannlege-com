aid: finn-tannlege-com
name: Finn-tannlege
description: >-
  Finn-tannlege.com is an independent, free directory of Norwegian dental clinics (5,447 clinics on 2026-09-19)
  assembled from public sources - the Brønnøysund Register Centre (Brreg), the Norwegian Health Personnel
  Register (HPR), the Norwegian Dental Association (NTF) and the clinics' own websites - and searchable
  by county (fylke), specialty, Helfo direct-billing agreement and emergency-duty (akuttvakt) availability.
  It is built for people and AI agents alike: an open, key-free REST API under /api/tannlege described
  by an OpenAPI 3.1 document, an A2A 1.0.0 agent card and JSON-RPC endpoint, a remote Streamable-HTTP
  MCP server plus an npm stdio package (finn-tannlege-mcp), an llms.txt and a ChatGPT Custom GPT. Operated
  by Daniel Fredriksen on the same Norwegian A2A agent platform as rettfrabonden.com and opplevagent.no;
  every clinic field is stored with its source and last-confirmed date, and the "Verified" badge is an
  editorially set status.
