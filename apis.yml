- aid: finn-tannlege-com:finn-tannlege-mcp-server
  name: Finn-tannlege MCP Server
  description: >-
    Model Context Protocol server in two shipped forms: a remote Streamable-HTTP endpoint at https://finn-tannlege.com/mcp
    (session-based - initialize first, then send the Mcp-Session-Id header) and the npm stdio package
    finn-tannlege-mcp (npx finn-tannlege-mcp) whose source lives in the mcp-server-dental folder of github.com/slookisen/lokal.
    Five read-only, annotated tools: tannlege_search, tannlege_info, tannlege_stats, tannlege_akutt and
    tannlege_kjeder. No authentication. A server card is served at /.well-known/mcp/server-card.json and
    /.well-known/mcp.json.
