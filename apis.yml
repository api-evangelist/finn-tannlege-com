apis:
- aid: finn-tannlege-com:finn-tannlege-a2a-agent
  name: Finn-tannlege A2A Agent
  description: >-
    The agent-to-agent surface: an anonymous A2A JSON-RPC 2.0 endpoint at https://finn-tannlege.com/a2a
    implementing message/send, described by a signed (EdDSA JWS, JWKS at /.well-known/jwks.json) agent
    card at /.well-known/agent-card.json that declares protocolVersion 1.0.0 and three skills - tannlege_search,
    tannlege_info and tannlege_stats. A natural-language or JSON message is parsed into clinic filters
    and answered with a completed task carrying a text summary artifact and a data artifact of matching
    clinics. No streaming, push notifications or task queries.
