  description: 'Operations tagged A2a across 2 of this provider''s published API definitions: finn-tannlege-com-openapi.json, finn-tannlege-com-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://finn-tannlege.com
  description: Production
tags:
- name: A2a
paths:
  /a2a:
    get:
      operationId: getDentalA2ACard
      summary: A2A agent card (health check)
      responses:
        '200':
          description: Agent card JSON
          content:
            application/json:
              schema:
                type: object
      tags:
      - A2a
    post:
      operationId: dentalA2AJsonRpc
      summary: A2A JSON-RPC 2.0 endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - method
              - id
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                method:
                  type: string
                  enum:
                  - message/send
                params:
                  type: object
                id:
                  type:
                  - string
                  - number
            examples:
              search:
                summary: Search clinics by county
                value:
                  jsonrpc: '2.0'
                  method: message/send
                  params:
                    message:
                      text: finn tannlege i Oslo
                  id: '1'
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  result:
                    type: object
                  error:
                    type: object
                  id:
                    type:
                    - string
                    - number
      tags:
      - A2a
    servers:
    - url: https://finn-tannlege.com
      description: Production
