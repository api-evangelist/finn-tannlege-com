openapi: 3.2.0
info:
  title: Finn-tannlege.com Llms.txt API
  description: REST API for Norwegian dental clinic discovery, sourced from Brreg, HPR, and direct enrichment. All read endpoints are public; no authentication required.
  version: 0.1.0
  contact:
    url: https://finn-tannlege.com/kontakt
  license:
    name: CC0 (Brreg data)
    url: https://creativecommons.org/publicdomain/zero/1.0/
servers:
- url: https://finn-tannlege.com
  description: Production
tags:
- name: Llms.txt
paths:
  /llms.txt:
    get:
      operationId: getLlmsTxt
      summary: LLM-friendly site overview
      responses:
        '200':
          description: Plain-text overview for LLMs
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Llms.txt
