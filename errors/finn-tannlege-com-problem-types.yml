format: json
format_note: >-
  Not RFC 9457. REST routes return a flat {"error": "<message>"} JSON object with a conventional HTTP
  status; the OpenAPI declares a 404 on getDentalAgent and a 400 on dentalMcpSse and nothing else - no
  error schema, no 5xx. The A2A endpoint returns JSON-RPC 2.0 error objects over HTTP 200; the MCP
  endpoint returns JSON-RPC errors over HTTP 200 inside a session and over HTTP 404 when the session is
  missing. There is no published error reference; entries marked observed were seen live on 2026-09-19.
